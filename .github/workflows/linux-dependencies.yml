name: Verify clean Linux dependency recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prepare pinned private Java
        shell: bash
        run: |
          java_home=$(tools/bootstrap.sh)
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
      - name: Build and package the unchanged game
        run: |
          ./gradlew --no-daemon check fatJar
          python3 tools/package_app.py --skip-build
      - name: Recover missing libraries inside disposable Ubuntu
        timeout-minutes: 7
        run: python3 tools/test_linux_desktop_container.py
      - name: Retain package-manager receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: emberwood-dependencies-${{ matrix.os }}
          path: |
            build/dependency-container/
            build/reports/tests/
          if-no-files-found: warn
