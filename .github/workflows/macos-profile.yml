name: Profile native Mac application
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native architecture to profile after reviewing its startup evidence
        type: choice
        required: true
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - both
      soak_seconds:
        description: Soak duration (180 for verification, 30 for diagnosis)
        type: choice
        required: true
        default: '180'
        options:
          - '180'
          - '30'
      audit:
        description: Native application audit to run
        type: choice
        required: true
        default: performance
        options: [performance, controls, controls-targeted, controls-capture, controls-buffering-compare, controls-scheduled, controls-opengl, main-movement, services-registration, startup-failure, compare-launchers, audio, audio-trace]
      held_capture:
        description: Main movement only — snapshot or independent stream during the fixed hold
        type: choice
        required: true
        default: snapshot
        options: [snapshot, stream-only]
      live_sample:
        description: Main movement only — sample the owned app during Left
        type: boolean
        default: false
      inspect_app_menu:
        description: Main movement only — physically inspect the app menu after movement passes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-profile:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'both' && '["macos-15-intel","macos-15"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare pinned private Java 25
        shell: bash
        run: |
          java_home=$(tools/bootstrap.sh)
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
      - name: Prepare rendered movement checks
        if: inputs.audit == 'main-movement'
        run: |
          python3 -m pip install 'Pillow==12.1.1'
          python3 -m unittest discover -s tools -p 'test_mac_main_movement.py' -v
      - name: Check, build and package
        run: |
          python3 -m unittest discover -s tools -p 'test_mac_bridge.py' -v
          python3 -m unittest discover -s tools -p 'test_mac_app*.py' -v
          python3 -m unittest discover -s tools -p 'test_mac_bundle*.py' -v
          python3 -m unittest discover -s tools -p 'test_physical_key.py' -v
          python3 -m unittest discover -s tools -p 'test_mac_startup_failure.py' -v
          python3 -m unittest tools.test_mac_stream_diagnostic -v
          ./gradlew --no-daemon check fatJar
          python3 tools/package_app.py --skip-build
      - name: Audit an isolated app through LaunchServices
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
          AUDIT_KIND: ${{ inputs.audit }}
          HELD_CAPTURE: ${{ inputs.held_capture }}
          LIVE_SAMPLE: ${{ inputs.live_sample }}
          INSPECT_APP_MENU: ${{ inputs.inspect_app_menu }}
        run: |
          case "$SOAK_SECONDS" in 30|180) ;; *) exit 2 ;; esac
          case "$AUDIT_KIND" in
            performance|controls|controls-targeted|audio)
              python3 tools/mac_app_profile.py --audit "$AUDIT_KIND" --soak-seconds "$SOAK_SECONDS" ;;
            audio-trace)
              python3 tools/mac_app_profile.py --audit audio --audio-trace ;;
            controls-capture)
              python3 tools/mac_app_profile.py --audit controls-capture --capture-trace ;;
            controls-buffering-compare)
              python3 tools/mac_capture_compare.py ;;
            controls-scheduled)
              python3 tools/mac_app_profile.py --audit controls-capture --capture-trace --rendering-variant scheduled-repaint ;;
            controls-opengl)
              python3 tools/mac_app_profile.py --audit controls-capture --capture-trace --rendering-variant opengl ;;
            main-movement)
              case "$HELD_CAPTURE" in snapshot|stream-only) ;; *) exit 2 ;; esac
              main_args=(--held-capture "$HELD_CAPTURE")
              case "$LIVE_SAMPLE" in
                true) main_args+=(--live-sample) ;;
                false) ;;
                *) exit 2 ;;
              esac
              case "$INSPECT_APP_MENU" in
                true) main_args+=(--inspect-app-menu) ;;
                false) ;;
                *) exit 2 ;;
              esac
              python3 tools/mac_main_movement.py --output build/main-movement-native-app "${main_args[@]}" ;;
            services-registration)
              "$JAVA_HOME/bin/java" --enable-native-access=ALL-UNNAMED -cp build/libs/emberwood-kotlin.jar:build/classes/kotlin/test emberwood.MacApplicationMenuProbe --observe-registration build/mac-services-registration ;;
            startup-failure)
              python3 tools/mac_startup_failure.py ;;
            compare-launchers)
              python3 tools/mac_profile_compare.py --java-home "$JAVA_HOME" --soak-seconds "$SOAK_SECONDS" ;;
            *) exit 2 ;;
          esac
      - name: Verify native menu identity and lifecycle
        if: inputs.audit != 'services-registration' && inputs.audit != 'startup-failure'
        timeout-minutes: 2
        run: >-
          "$JAVA_HOME/bin/java" --enable-native-access=ALL-UNNAMED
          -cp build/libs/emberwood-kotlin.jar:build/classes/kotlin/test
          emberwood.MacApplicationMenuProbe build/mac-menu-probe
      - name: Retain native application measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emberwood-native-profile-${{ matrix.os }}
          path: |
            build/performance-native-app/
            build/controls-native-app/
            build/controls-targeted-native-app/
            build/controls-capture-native-app/
            build/controls-capture-comparison/
            build/main-movement-native-app/
            build/mac-menu-probe/
            build/mac-services-registration/
            build/startup-failure-native-app/
            build/performance-launcher-comparison/
            build/audio-native-app/
            build/reports/tests/
            dist/*.zip
            dist/*.sha256
          if-no-files-found: warn
