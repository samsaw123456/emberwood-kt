name: Profile native Mac application
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native architecture to profile after reviewing its startup evidence
        type: choice
        required: true
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - both
permissions:
  contents: read
jobs:
  native-profile:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'both' && '["macos-15-intel","macos-15"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare pinned private Java 25
        shell: bash
        run: |
          java_home=$(tools/bootstrap.sh)
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
      - name: Check, build and package
        run: |
          ./gradlew --no-daemon check fatJar
          python3 tools/package_app.py --skip-build
      - name: Profile an isolated app through LaunchServices
        run: python3 tools/mac_app_profile.py
      - name: Retain native application measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emberwood-native-profile-${{ matrix.os }}
          path: |
            build/performance-native-app/
            build/reports/tests/
          if-no-files-found: warn
