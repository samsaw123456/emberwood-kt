name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare Linux display and packaging checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth desktop-file-utils libasound2t64
      - name: Prepare pinned private Java 25
        shell: bash
        run: |
          java_home=$(tools/bootstrap.sh)
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
      - name: Check and build
        run: ./gradlew --no-daemon check fatJar
      - name: Audit controls through a real window on Linux
        if: runner.os == 'Linux'
        run: EMBERWOOD_X11_PYTHON=/usr/bin/python3 xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew --no-daemon nativeAudit
      - name: Audit controls through a real window on macOS
        if: runner.os == 'macOS'
        run: ./gradlew --no-daemon nativeAudit
      - name: Validate installer on Linux
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tools -p 'test_install.py' -v
      - name: Package the native runtime
        run: python3 tools/package_app.py --skip-build
      - name: Verify actual installation and bundled launch
        shell: bash
        run: |
          for package in dist/emberwood-kotlin-*/; do
            python3 tools/test_package.py "$package"
          done
      - name: Audit the packaged runtime on Linux
        if: runner.os == 'Linux'
        run: EMBERWOOD_X11_PYTHON=/usr/bin/python3 xvfb-run -a -s '-screen 0 1280x800x24' python3 tools/audit_package.py
      - name: Audit the packaged runtime on macOS
        if: runner.os == 'macOS'
        run: python3 tools/audit_package.py
      - name: Retain verification and application artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emberwood-kotlin-${{ matrix.os }}
          path: |
            build/audit/
            build/audit-packaged/
            build/reports/tests/
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: warn
